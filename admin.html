<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライト OS - 管理者ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <header class="max-w-6xl mx-auto mb-6 pb-4 border-b border-pink-500/30 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-pink-400">⚙️ ライト 管理者ダッシュボード</h1>
        <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">管理者モード</span>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- 左カラム：システムプロンプト設定 ＆ 履歴復元 -->
        <section class="flex flex-col gap-6">
            
            <!-- プロンプト編集 -->
            <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-lg">
                <h2 class="text-lg font-bold text-cyan-400 mb-3 flex items-center gap-2">🧠 全体ルールの編集 (System Prompt)</h2>
                <textarea id="prompt-input" rows="6" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500 transition" 
                    placeholder="ライトのキャラクター設定や全体ルールを入力..."></textarea>
                <button onclick="saveSystemPrompt()" class="mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-500 hover:opacity-90 font-bold py-2.5 rounded-xl text-sm transition">
                    ☁️ ルールを更新して保存
                </button>
            </div>

            <!-- プロンプト履歴 ＆ ワンタップ復元 -->
            <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-lg flex-grow">
                <h2 class="text-lg font-bold text-amber-400 mb-3">📜 ルール変更履歴 (ワンタップ復元)</h2>
                <div id="history-list" class="flex flex-col gap-2 max-h-72 overflow-y-auto pr-1">
                    <span class="text-xs text-slate-500">履歴を読み込み中...</span>
                </div>
            </div>
        </section>

        <!-- 右カラム：リアルタイム会話ログ -->
        <section class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-lg flex flex-col h-[650px]">
            <h2 class="text-lg font-bold text-pink-400 mb-3 flex justify-between items-center">
                <span>💬 生徒の会話ログ (リアルタイム)</span>
                <span class="text-xs font-normal text-emerald-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live</span>
            </h2>
            <div id="logs-container" class="flex-grow overflow-y-auto flex flex-col gap-2 p-2 bg-slate-900/80 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500">ログを受信中...</span>
            </div>
        </section>

    </main>

    <script>
        // Firebase初期化 (v9 compat)
        const firebaseConfig = {
            apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
            authDomain: "light-65413.firebaseapp.com",
            projectId: "light-65413"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. 現在のプロンプト取得
        async function loadCurrentPrompt() {
            const doc = await db.collection("settings").doc("systemPrompt").get();
            if (doc.exists) {
                document.getElementById('prompt-input').value = doc.data().text || '';
            }
        }

        // 2. プロンプト保存 & 履歴追加
        async function saveSystemPrompt() {
            const text = document.getElementById('prompt-input').value.trim();
            if (!text) return alert("ルールを入力してください");

            try {
                // 設定を更新
                await db.collection("settings").doc("systemPrompt").set({
                    text: text,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 履歴に追加
                await db.collection("promptHistory").add({
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("全体ルールを保存・適用しました！");
                loadPromptHistory(); // 履歴リストを更新
            } catch (e) {
                alert("保存失敗: " + e.message);
            }
        }

        // 3. 履歴の読み込み
        function loadPromptHistory() {
            db.collection("promptHistory")
              .orderBy("timestamp", "desc")
              .limit(10)
              .get()
              .then(snapshot => {
                  const historyList = document.getElementById('history-list');
                  historyList.innerHTML = '';

                  if (snapshot.empty) {
                      historyList.innerHTML = '<span class="text-xs text-slate-500">過去の履歴はありません</span>';
                      return;
                  }

                  snapshot.forEach(doc => {
                      const data = doc.data();
                      const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('ja-JP') : '直近';
                      
                      const item = document.createElement('div');
                      item.className = "bg-slate-900/60 p-3 rounded-lg border border-slate-700 flex justify-between items-center text-xs gap-3";
                      // テキストをエンコードして関数に渡す（改行等でのバグを防ぐため）
                      item.innerHTML = `
                          <div class="overflow-hidden">
                              <div class="text-slate-400 font-bold mb-0.5">${timeStr}</div>
                              <div class="text-slate-300 truncate max-w-xs">${data.text}</div>
                          </div>
                          <button onclick="restorePrompt('${encodeURIComponent(data.text)}')" class="bg-amber-500/20 hover:bg-amber-500/40 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-md font-bold transition flex-shrink-0">
                              復元
                          </button>
                      `;
                      historyList.appendChild(item);
                  });
              });
        }

        // 4. ワンタップ復元
        window.restorePrompt = function(encodedText) {
            const text = decodeURIComponent(encodedText);
            document.getElementById('prompt-input').value = text;
            saveSystemPrompt(); // 復元後、即座に保存・適用
        };

        // 5. 会話ログのリアルタイム監視
        function listenToChatLogs() {
            db.collection("chatLogs")
              .orderBy("timestamp", "desc")
              .limit(50)
              .onSnapshot(snapshot => {
                  const container = document.getElementById('logs-container');
                  container.innerHTML = '';

                  if (snapshot.empty) {
                      container.innerHTML = '<span class="text-xs text-slate-500">会話ログはまだありません</span>';
                      return;
                  }

                  snapshot.forEach(doc => {
                      const data = doc.data();
                      const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) : '送信中...';
                      
                      const isAi = data.role === 'ai';
                      const roleTag = isAi ? '<span class="text-pink-400 font-bold">ライト</span>' : `<span class="text-emerald-400 font-bold">生徒</span>`;
                      const imgTag = data.hasImage ? '<span class="bg-blue-900/50 text-blue-300 px-1.5 py-0.5 rounded text-[10px] border border-blue-500/30">画像あり</span>' : '';

                      const div = document.createElement('div');
                      div.className = "bg-slate-800/50 p-2.5 rounded-lg border border-slate-700/50 text-xs flex flex-col gap-1";
                      div.innerHTML = `
                          <div class="flex justify-between items-center">
                              <div class="flex items-center gap-2">${roleTag} ${imgTag}</div>
                              <span class="text-[10px] text-slate-500">${timeStr}</span>
                          </div>
                          <div class="text-slate-200 whitespace-pre-wrap">${data.text || '(画像のみ送信)'}</div>
                      `;
                      container.appendChild(div);
                  });
              });
        }

        // 初期化処理の実行
        loadCurrentPrompt();
        loadPromptHistory();
        listenToChatLogs();
    </script>
</body>
</html>
