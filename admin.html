<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者メニュー</title>
<style>
  :root { --bg: #121118; --sidebar: #0a0a0f; --pink: #ff6b9e; --blue: #89c4d9; --box: #1c1b22; }
  body { margin: 0; background: var(--bg); color: #f0f0f0; display: flex; height: 100vh; font-family: sans-serif; }
  .sidebar { width: 260px; background: var(--sidebar); padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333;}
  .nav-btn { padding: 12px; border-radius: 8px; border: 1px solid #555; background: transparent; color: #fff; cursor: pointer; text-align: left; }
  .nav-btn.active { background: var(--blue); color: #000; font-weight: bold; border: none;}
  .main { flex: 1; padding: 40px; overflow-y: auto; }
  .section { display: none; }
  .section.active { display: block; }
  .memory-item { background: var(--box); padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; }
  .btn-del { background: #d9534f; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: #aaa; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: var(--box); color: #fff; }
</style>
</head>
<body>

<div class="sidebar">
  <div style="color:var(--pink); font-weight:bold; margin-bottom:20px;">✨ 管理者メニュー</div>
  <button class="nav-btn active" onclick="switchTab('knowledge')">🧠 Firebase記憶の管理</button>
  <button class="nav-btn" onclick="switchTab('settings')">⚙️ システム・アバター設定</button>
  <button class="nav-btn" onclick="location.href='index.html'">◀ チャットへ戻る</button>
</div>

<div class="main">
  <!-- 記憶管理 -->
  <div id="knowledge" class="section active">
    <h2 style="border-bottom: 1px solid #333; padding-bottom:10px;">部活全体 共有知識（Firestore）</h2>
    <div style="margin-bottom: 20px; display:flex; gap:10px;">
      <input type="text" id="newMem" placeholder="新しいルールを追加..." style="flex:1; padding:10px; background:var(--box); color:#fff; border:1px solid #555; border-radius:4px;">
      <button onclick="addMem()" style="padding:10px 20px; background:var(--blue); color:#000; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">追加</button>
    </div>
    <div id="memList"></div>
  </div>

  <!-- 設定 -->
  <div id="settings" class="section">
    <h2 style="border-bottom: 1px solid #333; padding-bottom:10px;">システム設定</h2>
    <div class="form-group"><label>Gemini API キー</label><input type="password" id="apiKey"></div>
    <div class="form-group"><label>アバター表示</label><select id="avaEn"><option value="true">ON</option><option value="false">OFF</option></select></div>
    <div class="form-group"><label>モード</label><select id="avaMode"><option value="2d">2D (画像)</option><option value="3d">3D (VRM)</option></select></div>
    <div class="form-group"><label>2Dパス (待機 / 喋る)</label><input type="text" id="idlePath" style="margin-bottom:5px;"><input type="text" id="speakPath"></div>
    <div class="form-group"><label>3D VRMパス</label><input type="text" id="vrmPath"></div>
    <button onclick="saveSet()" style="padding:10px 20px; background:var(--pink); color:#fff; border:none; border-radius:20px; width:100%; font-weight:bold; cursor:pointer;">保存</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
    authDomain: "light-65413.firebaseapp.com",
    projectId: "light-65413",
    storageBucket: "light-65413.firebasestorage.app",
    messagingSenderId: "116819261632",
    appId: "1:116819261632:web:9d9144aa125a55371d5525"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 記憶のリアルタイム監視
  onSnapshot(collection(db, "light_memories"), (snapshot) => {
    const list = document.getElementById('memList');
    list.innerHTML = '';
    snapshot.forEach((d) => {
      const div = document.createElement('div'); div.className = 'memory-item';
      div.innerHTML = `<span>${d.data().text}</span> <button class="btn-del" onclick="delMem('${d.id}')">削除</button>`;
      list.appendChild(div);
    });
  });

  window.addMem = async () => {
    const val = document.getElementById('newMem').value;
    if(val) { await addDoc(collection(db, "light_memories"), { text: val }); document.getElementById('newMem').value = ''; }
  };
  window.delMem = async (id) => await deleteDoc(doc(db, "light_memories", id));

  // タブ・設定管理
  window.switchTab = (id) => {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  };
  
  window.onload = () => {
    document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
    const s = JSON.parse(localStorage.getItem('avatarSettings')) || { enabled:"true", mode:"2d", idle:"./idle.png", speak:"./speak.png", vrm:"./light.vrm" };
    document.getElementById('avaEn').value = s.enabled; document.getElementById('avaMode').value = s.mode;
    document.getElementById('idlePath').value = s.idle; document.getElementById('speakPath').value = s.speak; document.getElementById('vrmPath').value = s.vrm;
  };
  window.saveSet = () => {
    localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value);
    localStorage.setItem('avatarSettings', JSON.stringify({ enabled:document.getElementById('avaEn').value, mode:document.getElementById('avaMode').value, idle:document.getElementById('idlePath').value, speak:document.getElementById('speakPath').value, vrm:document.getElementById('vrmPath').value }));
    alert('保存完了！');
  };
</script>
</body>
</html>
