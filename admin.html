async function checkAdmin(u){if(!u)return false;const s=await getDoc(doc(db,C.admins,u.uid));return s.exists()&&s.data()?.enabled===true}
function loginView(){root.innerHTML=`<div class="login"><div class="login-card"><h1>✨ ライト OS 管理者</h1><p class="muted">mightyX 管理コンソール</p><input id="email" type="email" placeholder="管理者メールアドレス"><input id="pass" type="password" placeholder="パスワード"><button class="primary" id="login">ログイン</button><button id="newAdmin">管理者アカウントを作る</button><div id="loginMsg" class="small"></div></div></div>`;$('login').onclick=login;$('newAdmin').onclick=registerAdmin}

const sections=[['brain','AI頭脳','🧠'],['personal','個人記憶','👤'],['band','バンド記憶','🎸'],['live','ライブ・部活','🎪'],['system','システム','⚙️']];
function renderNav(){ $('topTabs').innerHTML=sections.map(x=>`<button class="top-tab ${section===x[0]?'active':''}" data-section="${x[0]}">${x[2]} ${x[1]}</button>`).join('');$('topTabs').onclick=e=>{const b=e.target.closest('[data-section]');if(!b)return;section=b.dataset.section;sub='overview';selected=null;renderNav()};let groups={brain:[['overview','概要'],['light','ライト'],['oto','オト'],['explore','探索思考'],['memoryRules','記憶判断'],['providers','AIプロバイダ']],personal:[['overview','全ユーザー'],['people','人物'],['candidates','記憶候補']],band:[['overview','全バンド'],['members','メンバー'],['memories','共有記憶']],live:[['overview','タイムライン'],['events','ライブ'],['staff','スタッフ'],['troubles','トラブル・対処'],['photos','写真']],system:[['overview','状態'],['backup','バックアップ'],['settings','設定']]};$('side').innerHTML=`<div class="side-title">${sections.find(x=>x[0]===section)[1]}</div><input class="search" id="sideSearch" placeholder="検索…">${groups[section].map(x=>`<button class="${sub===x[0]?'active':''}" data-sub="${x[0]}">${x[1]}</button>`).join('')}`;$('side').onclick=e=>{const b=e.target.closest('[data-sub]');if(!b)return;sub=b.dataset.sub;selected=null;renderNav()};$('sideSearch').oninput=()=>renderMain();renderMain()}

function renderMain(){if(!adminReady)return;const main=$('main');const f=filterList; if(section==='brain')renderBrain();else if(section==='personal')renderPersonal(f);else if(section==='band')renderBand(f);else if(section==='live')renderLive(f);else renderSystem()}

const title=sub==='explore'?'自発的会話・探索思考':sub==='memoryRules'?'記憶判断ルール':sub==='light'?'ライトAI':'オトAI';const data=cache.brains.filter(b=>sub==='overview'||b.mode===sub);page(title,'AIの人格・判断・探索設定を管理する領域です.',`${cards([['AIブレイン',cache.brains.length,'ユーザー別の長期脳情報'],['記憶候補',cache.candidates.length,'自動記憶の保留状態'],['AIプロバイダ',cache.providers.length,'接続設定']])}<div class="card detail" style="margin-top:12px"><div class="tabs"><button class="inner-tab active">設定</button><button class="inner-tab">ルール</button><button class="inner-tab">診断</button></div><div class="notice">ここは今後の「自発的会話・探索思考」「確実性判定」「情報源自動選択」を一元管理する場所です。既存のFirestoreデータを壊さず、設定値を追加できる構造にしています。</div><div class="split"><div><div class="field"><label>探索の積極性</label><select id="exploreLevel"><option>必要な場合のみ</option><option>普通</option><option>積極的</option></select></div><div class="field"><label>質問の方針</label><select id="questionPolicy"><option>必要な場合のみ質問</option><option>関連情報があれば質問</option><option>積極的に質問</option></select></div></div><div><div class="field"><label>確実性</label><select id="certaintyPolicy"><option>確認情報と推測を分離</option><option>厳格</option><option>標準</option></select></div><div class="field"><label>保存方針</label><select><option>候補化して管理者確認</option><option>自動保存</option></select></div></div></div><button class="primary" id="saveBrainRules">設定を保存</button><span id="saveBrainMsg" class="small"></span></div>`);$('saveBrainRules').onclick=async()=>{await setDoc(doc(db,C.public,'ai_brain_rules'),{exploreLevel:$('exploreLevel').value,questionPolicy:$('questionPolicy').value,certaintyPolicy:$('certaintyPolicy').value,updatedAt:now(),updatedBy:auth.currentUser.uid},{merge:true});$('saveBrainMsg').textContent='保存しました。'} }
function renderPersonal(f){if(sub==='candidates'){const a=cache.candidates.filter(x=>x.status==='pending');page('記憶候補','会話から抽出された候補を確認・正式記憶化します.',`<div class="list">${a.map(c=>`<div class="item"><div class="item-head"><div><div class="title">${esc(c.userKey||'ユーザー')}</div><div class="small">${esc(c.bandName||'')} / ${c.createdAt?new Date(c.createdAt).toLocaleString('ja-JP'):''}</div></div><span class="tag warn">承認待ち</span></div><p>${esc(c.candidateText||'')}</p><div class="actions"><button class="primary" data-approve="${c.id}">正式記憶に採用</button><button class="danger" data-reject="${c.id}">却下</button></div></div>`).join('')||'<div class="empty">保留中の候補はありません。</div>'}</div>`);document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveCandidate(b.dataset.approve));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>updateDoc(doc(db,C.candidates,b.dataset.reject),{status:'rejected',rejectedAt:now(),rejectedBy:auth.currentUser.uid}).then(loadData));return}const users=f(cache.users,['name','displayName','username','id','bandName']);page('個人記憶','ユーザーごとに人物・記憶・会話・写真・関連情報を掘り下げます.',`<div class="toolbar"><input id="userFilter" placeholder="ユーザー名・バンド名・合言葉で検索"><span class="tag ok">${users.length}人</span></div><div class="list">${users.map(u=>`<div class="item"><div class="item-head"><div><div class="title">${esc(u.name||u.displayName||u.username||u.id)}</div><div class="small">${esc(u.bandName||'未所属')} / ${esc(u.id)}</div></div><span class="tag">${Number(u.loginCount||0)}回</span></div><div class="actions" style="margin-top:8px"><button class="primary" data-open-user="${esc(u.id)}">開く</button><button data-edit-user="${esc(u.id)}">プロフィール編集</button></div></div>`).join('')||'<div class="empty">ユーザーがありません。</div>'}</div>`);$('userFilter').oninput=()=>{const q=$('userFilter').value.toLowerCase();document.querySelectorAll('#main .item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')};document.querySelectorAll('[data-open-user]').forEach(b=>b.onclick=()=>openUser(b.dataset.openUser));document.querySelectorAll('[data-edit-user]').forEach(b=>b.onclick=()=>profileModal(cache.users.find(x=>x.id===b.dataset.editUser)))}
function openUser(id){const u=cache.users.find(x=>x.id===id);if(!u)return;const brain=cache.brains.find(x=>x.id===id)||{};const files=cache.files.filter(x=>x.scopeType==='personal'&&(x.scopeId===id||x.userKey===id));const photos=cache.photos.filter(x=>x.userKey===id||x.username===u.username);page(u.name||u.id,`${u.bandName||'未所属'} / ${u.birthday||'誕生日未登録'}`,`<div class="tabs"><button class="inner-tab active">概要</button><button class="inner-tab">記憶</button><button class="inner-tab">楽器・機材</button><button class="inner-tab">関係</button><button class="inner-tab">写真</button></div><div class="grid">${cards([['長期脳',brain.summary?'あり':'なし'],['個人記憶',files.length+'件'],['写真',photos.length+'件']])}</div><div class="card" style="margin-top:12px"><h3>基本情報</h3><div class="split"><div class="field"><label>名前</label><input id="duName" value="${esc(u.name||'')}"></div><div class="field"><label>バンド</label><input id="duBand" value="${esc(u.bandName||'')}"></div></div><div class="field"><label>誕生日</label><input id="duBirth" value="${esc(u.birthday||'')}"></div><button class="primary" id="saveDU">プロフィールを保存</button><div id="duMsg" class="small"></div></div><div class="card" style="margin-top:12px"><h3>長期記憶</h3><textarea id="brainSummary" rows="8">${esc(brain.summary||'')}</textarea><button class="primary" id="saveBrainSummary" style="margin-top:8px">長期記憶を保存</button></div><div class="card" style="margin-top:12px"><h3>関連情報</h3><div>${[u.bandName&&'🎸 '+u.bandName,files.length&&'🧠 '+files.length+'件の記憶',photos.length&&'📷 '+photos.length+'枚'].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="muted">関連情報なし</span>'}</div></div>`);$('saveDU').onclick=async()=>{await setDoc(doc(db,C.users,id),{name:$('duName').value.trim(),displayName:$('duName').value.trim(),bandName:$('duBand').value.trim(),birthday:$('duBirth').value.trim(),updatedAt:now(),updatedBy:auth.currentUser.uid},{merge:true});$('duMsg').textContent='保存しました。';await loadData()};$('saveBrainSummary').onclick=async()=>{await setDoc(doc(db,C.brains,id),{userKey:id,authUid:u.authUid||'',bandId:u.bandId||'',bandName:u.bandName||'',summary:$('brainSummary').value.slice(0,3500),updatedAt:now()},{merge:true});$('duMsg').textContent='長期記憶を保存しました。';await loadData()}}
function renderBand(f){const bands=f(cache.bands,['name','id','normalizedName']);page('バンド記憶','バンド単位のメンバー・ライブ・機材・トラブルを管理します.',`<div class="toolbar"><input id="bandFilter" placeholder="バンド名で検索"><span class="tag ok">${bands.length}組</span></div><div class="list">${bands.map(b=>`<div class="item"><div class="item-head"><div><div class="title">${esc(b.name||b.id)}</div><div class="small">ID: ${esc(b.id)}</div></div><span class="tag">${cache.users.filter(u=>u.bandId===b.id).length}人</span></div><div class="actions" style="margin-top:8px"><button class="primary" data-open-band="${esc(b.id)}">開く</button></div></div>`).join('')||'<div class="empty">バンドがありません。</div>'}</div>`);$('bandFilter').oninput=()=>{const q=$('bandFilter').value.toLowerCase();document.querySelectorAll('#main .item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')};document.querySelectorAll('[data-open-band]').forEach(b=>b.onclick=()=>openBand(b.dataset.openBand))}
function openBand(id){const b=cache.bands.find(x=>x.id===id);const ms=cache.users.filter(x=>x.bandId===id);const mem=cache.files.filter(x=>x.scopeType==='band'&&x.scopeId===id);const hist=cache.history.filter(x=>x.bandId===id);page(b?.name||id,'バンド詳細',`<div class="grid">${cards([['メンバー',ms.length],['共有記憶',mem.length],['ライブ履歴',hist.length]])}</div><div class="card" style="margin-top:12px"><h3>メンバー</h3><div class="list">${ms.map(u=>`<div class="item"><b>${esc(u.name||u.id)}</b><div class="small">${esc(u.id)} / ${esc(u.bandName||'')}</div></div>`).join('')||'<div class="empty">メンバーなし</div>'}</div></div><div class="card" style="margin-top:12px"><h3>共有記憶</h3><div class="list">${mem.map(m=>`<div class="item"><div class="title">${esc(m.title||'無題')}</div><div class="small">${esc(m.certainty||'未設定')} / ${esc(m.validity||'')}</div><div style="white-space:pre-wrap;margin-top:6px">${esc(m.details||'')}</div></div>`).join('')||'<div class="empty">共有記憶なし</div>'}</div></div>`)}
function renderLive(f){if(sub==='photos'){const ps=f(cache.photos,['title','name','bandName','category','eventTitle','date']);page('写真','写真記憶をライブ・人物・バンドと関連づけて確認します.',`<div class="list">${ps.slice(0,100).map(p=>`<div class="item"><div class="title">${esc(p.title||'写真')}</div><div class="small">${esc(p.date||'')} / ${esc(p.name||p.username||'')} / ${esc(p.bandName||'')} / ${esc(p.category||'')}</div><div class="small" style="margin-top:5px">AI: ${esc(p.aiSummary||p.aiObservation||'なし')}</div></div>`).join('')||'<div class="empty">写真なし</div>'}</div>`);return}if(sub==='staff'||sub==='troubles'||sub==='events'){}const hs=f(cache.history,['title','date','details','bandName']);page('ライブ・部活','タイムライン・ライブ・スタッフ・トラブルをまとめて扱う領域です.',`<div class="toolbar"><span class="tag ok">${hs.length}件</span><button class="primary" id="addHistory">＋出来事</button></div><div class="list">${hs.slice(0,120).map(h=>`<div class="item"><div class="item-head"><div><div class="title">${esc(h.date||'')} ${esc(h.title||'')}</div><div class="small">${esc(h.bandName||'')} / ${esc(h.scopeType||'')}</div></div><span class="tag">${esc(h.category||'部史')}</span></div><div style="white-space:pre-wrap;margin-top:7px">${esc(h.details||'')}</div><div class="small" style="margin-top:6px">${(h.tags||[]).map(t=>`#${esc(t)} `).join('')}</div></div>`).join('')||'<div class="empty">履歴なし</div>'}</div>`);$('addHistory').onclick=()=>historyModal()}
function renderSystem(){if(sub==='backup'){page('バックアップ','Firestoreの主要データをJSONとして書き出します。Authアカウントと管理者情報は対象外です.',`<div class="card"><div class="notice">既存データを壊さないため、復元は明示操作に限定します。写真チャンクも含める場合は容量に注意してください。</div><div class="actions" style="margin-top:12px"><button class="primary" id="export">JSONバックアップ作成</button><input id="restore" type="file" accept="application/json"></div><div id="backupMsg" class="small" style="margin-top:10px"></div></div>`);$('export').onclick=exportBackup;return}page('システム','接続状態・データ件数・現在のFirebase構成を確認します.',`${cards([['ユーザー',cache.users.length],['バンド',cache.bands.length],['記憶ファイル',cache.files.length],['写真',cache.photos.length],['履歴',cache.history.length],['AIプロバイダ',cache.providers.length]])}<div class="card" style="margin-top:12px"><h3>固定基盤</h3><div class="notice">Firebase projectId: <b>light-65413</b><br>Authentication: Email/Password<br>Firestore: 現行コレクションを使用<br>Cloud Functions / Firebase Storage: 使用しない<br>管理者権限: light_admins/{UID}.enabled</div></div>`)}
function providerModal(p){modal('AIプロバイダ',`<div class="field"><label>表示名</label><input id="mpName" value="${esc(p.name||'')}"></div><div class="field"><label>provider</label><input id="mpProvider" value="${esc(p.provider||'gemini')}"></div><div class="field"><label>model</label><input id="mpModel" value="${esc(p.model||'gemini-3.8-flash')}"></div><div class="field"><label>APIキー（入力時のみ更新）</label><input id="mpKey" type="password" placeholder="変更しない場合は空欄"></div><div class="field"><label>priority</label><input id="mpPriority" type="number" value="${Number(p.priority||0)}"></div><div class="actions"><button class="primary" id="saveMP">保存</button></div>`);$('saveMP').onclick=async()=>{const data={name:$('mpName').value.trim(),provider:$('mpProvider').value.trim(),model:$('mpModel').value.trim(),priority:Number($('mpPriority').value||0),enabled:true,updatedAt:now(),updatedBy:auth.currentUser.uid};if($('mpKey').value)data.apiKey=$('mpKey').value;await setDoc(doc(db,C.providers,p.id||('provider_'+Date.now())),data,{merge:true});closeModal();await loadData()}}
function profileModal(u={}){modal('プロフィール編集',`<div class="field"><label>合言葉キー</label><input id="muKey" value="${esc(u.id||'')}" disabled></div><div class="field"><label>名前</label><input id="muName" value="${esc(u.name||u.displayName||'')}"></div><div class="field"><label>誕生日 MM-DD</label><input id="muBirth" value="${esc(u.birthday||'')}"></div><div class="field"><label>バンド</label><input id="muBand" value="${esc(u.bandName||'')}"></div><button class="primary" id="saveMU">保存</button>`);$('saveMU').onclick=async()=>{await setDoc(doc(db,C.users,u.id),{name:$('muName').value.trim(),displayName:$('muName').value.trim(),birthday:$('muBirth').value.trim(),bandName:$('muBand').value.trim(),updatedAt:now(),updatedBy:auth.currentUser.uid},{merge:true});closeModal();await loadData()}}
function historyModal(){modal('出来事を追加',`<div class="split"><div class="field"><label>日付</label><input id="mhDate" type="date"></div><div class="field"><label>タイトル</label><input id="mhTitle"></div></div><div class="field"><label>詳細</label><textarea id="mhDetails" rows="7"></textarea></div><div class="field"><label>タグ</label><input id="mhTags" placeholder="ライブ,トラブル,PA"></div><button class="primary" id="saveMH">保存</button>`);$('saveMH').onclick=async()=>{await addDoc(collection(db,C.history),{date:$('mhDate').value,title:$('mhTitle').value.trim(),details:$('mhDetails').value.trim(),tags:$('mhTags').value.split(',').map(x=>x.trim()).filter(Boolean),scopeType:'club',createdAt:now(),createdBy:auth.currentUser.uid});closeModal();await loadData()}}
function modal(title,body){const m=document.createElement('div');m.className='modal show';m.id='modal';m.innerHTML=`<div class="modal-card"><div class="modal-head"><h2 style="margin:0;font-size:18px">${esc(title)}</h2><button id="closeM">✕</button></div>${body}</div>`;document.body.appendChild(m);$('closeM').onclick=closeModal}function closeModal(){$('modal')?.remove()}
async function approveCandidate(id){const s=await getDoc(doc(db,C.candidates,id));if(!s.exists())return;const c={id,...s.data()};await addDoc(collection(db,C.files),{title:`会話からの記憶：${String(c.candidateText||'').slice(0,60)}`,details:String(c.candidateText||'').slice(0,3000),scopeType:'personal',scopeId:c.scopeId,authUid:c.authUid,userKey:c.userKey,bandId:c.bandId||'',bandName:c.bandName||'',kind:'text',category:'personal',subcategory:'自動記憶候補',certainty:'confirmed',validity:'current',enabled:true,createdBy:'admin',createdAt:now(),updatedAt:now(),candidateId:id});await updateDoc(doc(db,C.candidates,id),{status:'approved',approvedAt:now(),approvedBy:auth.currentUser.uid});await loadData()}
async function exportBackup(){const names=[C.users,C.bands,C.members,C.brains,C.memories,C.files,C.candidates,C.history,C.historyEdits,C.photos,C.photoEdits,C.public,C.avatarConfig];const out={version:'mightyX-admin-browser-1',exportedAt:new Date().toISOString(),notice:'Auth accounts, admin records and AI secrets are excluded.',collections:{},imageChunks:[]};for(const n of names){const s=await getDocs(collection(db,n));out.collections[n]=s.docs.map(d=>({id:d.id,data:d.data()}))}for(const p of out.collections[C.photos]||[]){const s=await getDocs(collection(db,C.photos,p.id,'chunks'));s.forEach(d=>out.imageChunks.push({imageId:p.id,id:d.id,data:d.data()}))}const blob=new Blob([JSON.stringify(out)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`light-mightyX-admin-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$('backupMsg').textContent=`完了 ${(blob.size/1024/1024).toFixed(2)}MB`}
async function loadData(){msg('データ読み込み中…');const read=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));[cache.users,cache.bands,cache.brains,cache.memories,cache.files,cache.candidates,cache.history,cache.photos,cache.providers]=await Promise.all([read(C.users),read(C.bands),read(C.brains),read(C.memories),read(C.files),read(C.candidates),read(C.history),read(C.photos),read(C.providers)]);msg('接続済み',true);renderMain()}
async function boot(){if(!auth.currentUser){loginView();return}if(!(await checkAdmin(auth.currentUser))){await signOut(auth);loginView();return}adminReady=true;shell();await loadData()}
onAuthStateChanged(auth,u=>{if(u)boot().catch(e=>{console.error(e);loginView()});else{adminReady=false;loginView()}});
</script></body></html>
