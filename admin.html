<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライト OS - 管理者</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #121520; }
    </style>
</head>
<body class="text-slate-200 h-screen flex font-sans">

    <!-- パスワード画面 -->
    <div id="auth-screen" class="fixed inset-0 bg-[#121520] z-50 flex flex-col items-center justify-center">
        <h2 class="text-pink-400 text-xl font-bold mb-6">⚙️ 管理者ログイン</h2>
        <input type="password" id="pass-input" placeholder="管理者パスワード" class="bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-center mb-4">
        <button onclick="checkAdminPassword()" class="bg-cyan-600 px-8 py-3 rounded-full font-bold">ログイン</button>
    </div>

    <!-- 左サイドバー -->
    <aside id="sidebar" class="w-64 bg-[#0d1017] border-r border-slate-800 flex flex-col p-4 hidden">
        <h1 class="text-lg font-bold text-pink-400 tracking-wider mb-8 flex items-center gap-2">
            ✨ 管理者メニュー
        </h1>
        <nav class="flex flex-col gap-3">
            <button onclick="switchTab('knowledge')" id="tab-knowledge" class="bg-cyan-500/20 text-cyan-300 font-bold px-4 py-3 rounded-lg border border-cyan-500/30 text-left flex items-center gap-2">
                🧠 共有知識の管理
            </button>
            <button class="text-slate-400 px-4 py-3 rounded-lg border border-slate-700 text-left flex items-center gap-2 hover:bg-slate-800">
                🖼️ アバター表示設定
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="text-slate-400 px-4 py-3 rounded-lg border border-slate-700 text-left flex items-center gap-2 hover:bg-slate-800">
                💬 トーク履歴閲覧
            </button>
        </nav>
    </aside>

    <!-- メインコンテンツ -->
    <main id="main-content" class="flex-grow p-8 hidden flex-col">
        
        <!-- 共有知識タブ -->
        <section id="sec-knowledge" class="w-full max-w-4xl">
            <h2 class="text-xl font-bold mb-2">部活全体 共有知識（ライトの記憶）</h2>
            <p class="text-xs text-slate-500 mb-6">部員全員のライトに共通して反映されるルールや事実です。</p>
            
            <div class="flex flex-col gap-4 bg-[#1a1f2e] p-6 rounded-xl border border-slate-700">
                <textarea id="prompt-input" rows="4" placeholder="新しいルールを入力..." class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:border-cyan-500 outline-none w-full"></textarea>
                <button onclick="saveRule()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold px-6 py-2 rounded-lg self-end">
                    追加 / 更新
                </button>
            </div>
        </section>

        <!-- トーク履歴タブ -->
        <section id="sec-history" class="w-full max-w-4xl hidden h-full flex-col">
            <h2 class="text-xl font-bold mb-6 text-pink-300 flex justify-between items-center">
                <span>💬 リアルタイム トーク履歴</span>
                <span class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded border border-red-500/30 animate-pulse">Live</span>
            </h2>
            <div id="logs-container" class="flex-grow bg-[#1a1f2e] rounded-xl border border-slate-700 p-4 overflow-y-auto flex flex-col gap-3">
                <span class="text-xs text-slate-500">ログを待機中...</span>
            </div>
        </section>

    </main>

    <script>
        function checkAdminPassword() {
            if (document.getElementById('pass-input').value === 'admin999') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                initFirebase();
            } else {
                alert('パスワードが違います');
            }
        }

        function switchTab(tabId) {
            document.getElementById('sec-knowledge').classList.add('hidden');
            document.getElementById('sec-history').classList.add('hidden');
            
            document.getElementById('tab-knowledge').className = "text-slate-400 px-4 py-3 rounded-lg border border-slate-700 text-left flex items-center gap-2 hover:bg-slate-800";
            document.getElementById('tab-history').className = "text-slate-400 px-4 py-3 rounded-lg border border-slate-700 text-left flex items-center gap-2 hover:bg-slate-800";

            if (tabId === 'knowledge') {
                document.getElementById('sec-knowledge').classList.remove('hidden');
                document.getElementById('tab-knowledge').className = "bg-cyan-500/20 text-cyan-300 font-bold px-4 py-3 rounded-lg border border-cyan-500/30 text-left flex items-center gap-2";
            } else {
                document.getElementById('sec-history').classList.remove('hidden');
                document.getElementById('sec-history').classList.add('flex');
                document.getElementById('tab-history').className = "bg-cyan-500/20 text-cyan-300 font-bold px-4 py-3 rounded-lg border border-cyan-500/30 text-left flex items-center gap-2";
            }
        }

        // Firebase初期化とデータ連携
        let db;
        function initFirebase() {
            const firebaseConfig = {
                apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
                authDomain: "light-65413.firebaseapp.com",
                projectId: "light-65413"
            };
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();

            // ルール読み込み
            db.collection("settings").doc("systemPrompt").get().then(doc => {
                if (doc.exists) document.getElementById('prompt-input').value = doc.data().text || '';
            });

            // リアルタイムログ受信
            db.collection("chatLogs").orderBy("timestamp", "desc").limit(30).onSnapshot(snapshot => {
                const container = document.getElementById('logs-container');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const isAi = data.role === 'ai';
                    const name = isAi ? '<span class="text-pink-400 font-bold">ライト</span>' : '<span class="text-cyan-400 font-bold">生徒</span>';
                    const div = document.createElement('div');
                    div.className = "bg-slate-800/50 p-3 rounded-lg text-sm text-slate-300 border border-slate-700/50";
                    div.innerHTML = `<div class="mb-1 text-xs">${name}</div><div>${data.text || '[画像送信]'}</div>`;
                    container.appendChild(div);
                });
            });
        }

        async function saveRule() {
            const text = document.getElementById('prompt-input').value;
            await db.collection("settings").doc("systemPrompt").set({
                text: text, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("ルールを更新しました！");
        }
    </script>
</body>
</html>
