<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライト 管理者ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #0b0b10; color: #ffffff; font-family: sans-serif; }
    .card-border { border-left: 4px solid #f59e0b; background-color: #161620; }
  </style>
</head>
<body class="h-screen w-screen flex">

  <!-- 左側サイドバー -->
  <div class="w-64 bg-[#07070a] border-r border-gray-900 flex flex-col p-4 space-y-6">
    <div class="text-sm font-bold text-pink-400 flex items-center gap-2 px-2"><span>✨</span> 管理者メニュー</div>
    <nav class="space-y-2">
      <button onclick="switchTab('knowledge')" id="btn-tab-knowledge" class="w-full text-left bg-cyan-500/20 text-cyan-300 font-bold px-4 py-3 rounded-lg text-xs flex items-center gap-2 border border-cyan-500/30">
        🧠 共有知識の管理
      </button>
      <button onclick="switchTab('avatar')" id="btn-tab-avatar" class="w-full text-left text-gray-400 hover:bg-gray-900 px-4 py-3 rounded-lg text-xs flex items-center gap-2 border border-transparent">
        🖼️ アバター管理
      </button>
      <button onclick="switchTab('logs')" id="btn-tab-logs" class="w-full text-left text-gray-400 hover:bg-gray-900 px-4 py-3 rounded-lg text-xs flex items-center gap-2 border border-transparent">
        💬 トーク履歴閲覧
      </button>
    </nav>
  </div>

  <!-- 右側メインコンテンツ -->
  <div class="flex-1 h-full overflow-y-auto p-8 bg-[#0b0b10]">
    
    <!-- Tab 1: 共有知識 (省略なし) -->
    <div id="tab-knowledge" class="space-y-6">
      <div>
        <h1 class="text-xl font-bold text-white">部活全体 共有知識（ライトの記憶）</h1>
        <p class="text-xs text-gray-500 mt-1">部員全員のライトに共通して反映されるルール</p>
      </div>
      <div class="flex gap-2">
        <input id="new-rule-input" type="text" placeholder="新しい共有知識を入力..." class="flex-1 bg-[#161620] border border-gray-800 rounded-lg px-4 py-2 text-sm">
        <button onclick="addRule()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-2 rounded-lg text-sm">追加</button>
      </div>
      <div id="rules-container" class="space-y-3"></div>
    </div>

    <!-- 🌟 Tab 2: アバター管理 (新規追加) -->
    <div id="tab-avatar" class="hidden space-y-6">
      <div>
        <h1 class="text-xl font-bold text-white">アバター画像の管理 (URL設定)</h1>
        <p class="text-xs text-gray-500 mt-1">ここに画像のURLをコピペして保存すると、即座にメインアプリの見た目が変わります。</p>
      </div>
      
      <div class="bg-[#161620] p-6 rounded-xl border border-gray-800 space-y-4 max-w-2xl">
        <div>
          <label class="block text-sm text-gray-400 mb-1">通常状態 (normal)</label>
          <input id="url-normal" type="text" class="w-full bg-[#0b0b10] border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:border-pink-500 outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">笑顔 (smile)</label>
          <input id="url-smile" type="text" class="w-full bg-[#0b0b10] border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:border-pink-500 outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">考える・悩む (think)</label>
          <input id="url-think" type="text" class="w-full bg-[#0b0b10] border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:border-pink-500 outline-none">
        </div>
        <div class="pt-4 flex items-center gap-4">
          <button onclick="saveAvatarConfig()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-8 py-2 rounded-lg transition shadow-[0_0_10px_rgba(255,101,132,0.4)]">
            アバターを更新して反映
          </button>
          <span id="avatar-save-msg" class="text-sm text-cyan-400 opacity-0 transition-opacity">✅ 反映しました！</span>
        </div>
      </div>
    </div>

    <!-- Tab 3: トーク履歴 -->
    <div id="tab-logs" class="hidden space-y-6">
      <h1 class="text-xl font-bold text-white">生徒のトーク履歴（リアルタイム）</h1>
      <div id="logs-container" class="space-y-4"></div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentRules = [];

    window.onload = () => {
      // 共有知識ロード
      db.collection("settings").doc("sharedKnowledge").onSnapshot(doc => {
        currentRules = (doc.exists && doc.data().items) ? doc.data().items : [];
        renderRules();
      });

      // アバター設定ロード (画面表示用)
      db.collection("settings").doc("avatarConfig").get().then(doc => {
        if (doc.exists) {
          document.getElementById("url-normal").value = doc.data().normal || "";
          document.getElementById("url-smile").value = doc.data().smile || "";
          document.getElementById("url-think").value = doc.data().think || "";
        }
      });

      // ログロード
      db.collection("chatLogs").orderBy("timestamp", "desc").onSnapshot(snap => {
        const container = document.getElementById("logs-container");
        container.innerHTML = "";
        snap.forEach(d => {
          const data = d.data();
          container.innerHTML += `
            <div class="bg-[#161620] p-4 rounded-xl border border-gray-800 space-y-1 text-xs">
              <div class="text-gray-500">${data.timestamp ? data.timestamp.toDate().toLocaleString() : '...'}</div>
              <div class="text-pink-300">生徒: ${data.userText}</div>
              <div class="text-gray-300">ライト: ${data.lightReply}</div>
            </div>`;
        });
      });
    };

    // --- アバター保存処理 ---
    async function saveAvatarConfig() {
      const normal = document.getElementById("url-normal").value.trim();
      const smile = document.getElementById("url-smile").value.trim();
      const think = document.getElementById("url-think").value.trim();
      
      await db.collection("settings").doc("avatarConfig").set({ normal, smile, think });
      
      // 保存完了メッセージのアニメーション
      const msg = document.getElementById("avatar-save-msg");
      msg.classList.remove("opacity-0");
      setTimeout(() => msg.classList.add("opacity-0"), 2000);
    }

    // --- 共有知識周り (変更なし) ---
    function renderRules() {
      const container = document.getElementById("rules-container");
      container.innerHTML = "";
      currentRules.forEach((rule, index) => {
        container.innerHTML += `
          <div class="card-border p-4 rounded-r-xl flex justify-between items-center text-sm text-gray-200">
            <span>${rule}</span>
            <button onclick="deleteRule(${index})" class="bg-[#d97706] hover:bg-[#b45309] text-white text-xs px-3 py-1.5 rounded transition">削除</button>
          </div>`;
      });
    }
    async function addRule() {
      const input = document.getElementById("new-rule-input");
      if (!input.value.trim()) return;
      currentRules.push(input.value.trim());
      await db.collection("settings").doc("sharedKnowledge").set({ items: currentRules });
      input.value = "";
    }
    async function deleteRule(index) {
      currentRules.splice(index, 1);
      await db.collection("settings").doc("sharedKnowledge").set({ items: currentRules });
    }

    // --- タブ切り替え処理 ---
    function switchTab(tabName) {
      ['knowledge', 'avatar', 'logs'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tabName);
        const btn = document.getElementById(`btn-tab-${t}`);
        if (t === tabName) {
          btn.className = "w-full text-left bg-cyan-500/20 text-cyan-300 font-bold px-4 py-3 rounded-lg text-xs flex items-center gap-2 border border-cyan-500/30";
        } else {
          btn.className = "w-full text-left text-gray-400 hover:bg-gray-900 px-4 py-3 rounded-lg text-xs flex items-center gap-2 border border-transparent";
        }
      });
    }
  </script>
</body>
</html>
