<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライト OS</title>
<style>
  :root { --bg: #0d0d12; --pink: #ff6b9e; --blue: #00d2ff; --chat-bg: rgba(20, 19, 28, 0.85); }
  body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  #avatarContainer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; display: flex; justify-content: center; align-items: center; pointer-events: none;}
  #avatar2D { height: 90vh; max-width: 100%; object-fit: contain; }
  #chatUI { position: relative; z-index: 10; width: 600px; height: 85vh; display: flex; flex-direction: column; background: var(--chat-bg); border-radius: 12px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #333; }
  .header-title { color: var(--pink); font-weight: bold; font-size: 18px; }
  .header-btns button { background: transparent; border: 1px solid #555; color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer; margin-left: 8px; transition: 0.3s;}
  .header-btns button:hover { border-color: var(--pink); }
  .chat-log { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 85%; line-height: 1.5; font-size: 14px; }
  .msg-ai { color: #ddd; align-self: flex-start; }
  .msg-ai span.name { color: var(--pink); font-weight: bold; margin-right: 8px; }
  .msg-user { color: #fff; align-self: flex-end; background: #2a2a35; padding: 10px 15px; border-radius: 12px 12px 0 12px; }
  .msg-sys { background: #3a1c22; color: #ff8fb3; padding: 8px; border-radius: 6px; font-size: 12px; text-align: center; margin: 0 auto; width: 80%; }
  .input-area { display: flex; padding: 15px; border-top: 1px solid #333; align-items: center; gap: 10px; }
  .btn-record { width: 45px; height: 45px; border-radius: 50%; background: #333; border: 2px solid var(--pink); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; transition: 0.2s;}
  .btn-record.recording { background: var(--pink); box-shadow: 0 0 15px var(--pink); animation: pulse 1s infinite; }
  .text-input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #555; background: #111; color: #fff; }
  .btn-send { background: var(--blue); color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--blue); }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
    }
  }
</script>
</head>
<body>

<div id="avatarContainer"><img id="avatar2D" src="" style="display: none;" /></div>

<div id="chatUI">
  <div class="header">
    <div class="header-title">✨ ライト</div>
    <div class="header-btns"><button onclick="location.href='admin.html'">⚙ 設定 (管理者)</button></div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="input-area">
    <button class="btn-record" id="micBtn">🎤</button>
    <input type="text" id="userInput" class="text-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn-send" onclick="sendMessage()">送信</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { VRMLoaderPlugin } from '@pixiv/three-vrm';

  // 1. Firebase 初期化
  const firebaseConfig = {
    apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
    authDomain: "light-65413.firebaseapp.com",
    projectId: "light-65413",
    storageBucket: "light-65413.firebasestorage.app",
    messagingSenderId: "116819261632",
    appId: "1:116819261632:web:9d9144aa125a55371d5525"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 2. 設定と状態
  const settings = JSON.parse(localStorage.getItem('avatarSettings')) || { enabled: "true", mode: "2d", idle: "./idle.png", speak: "./speak.png", vrm: "./light.vrm" };
  const apiKey = localStorage.getItem('gemini_api_key');
  let isSpeaking = false;
  let sharedMemories = "";

  // 3. アバター制御
  const container = document.getElementById('avatarContainer');
  const img2D = document.getElementById('avatar2D');
  if (settings.enabled === "true") {
    if (settings.mode === "2d") {
      img2D.style.display = "block";
      img2D.src = settings.idle;
      setInterval(() => { img2D.src = isSpeaking ? (Math.random() > 0.5 ? settings.speak : settings.idle) : settings.idle; }, 150);
    } else if (settings.mode === "3d") {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(0, 1.4, 3);
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);
      const light = new THREE.DirectionalLight(0xffffff, Math.PI); light.position.set(1, 1, 1).normalize(); scene.add(light);
      const loader = new GLTFLoader(); loader.register((parser) => new VRMLoaderPlugin(parser));
      loader.load(settings.vrm, (gltf) => { const vrm = gltf.userData.vrm; scene.add(vrm.scene); vrm.scene.rotation.y = Math.PI; }, undefined, (e) => console.error(e));
      const animate = () => { requestAnimationFrame(animate); renderer.render(scene, camera); }; animate();
    }
  }

  // 4. Firestoreから記憶を取得
  async function loadMemories() {
    try {
      const querySnapshot = await getDocs(collection(db, "light_memories"));
      let mems = [];
      querySnapshot.forEach((doc) => mems.push(`- ${doc.data().text}`));
      sharedMemories = mems.join('\n');
      appendMsg('ai', 'よっ！準備OKだよ。話しかけて！');
    } catch (e) { appendMsg('sys', '記憶の読み込みに失敗しました: ' + e.message); }
  }
  loadMemories();

  // 5. 音声認識 (Web Speech API)
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  
  micBtn.onclick = () => {
    micBtn.classList.add('recording');
    recognition.start();
  };
  recognition.onresult = (event) => {
    document.getElementById('userInput').value = event.results[0][0].transcript;
    sendMessage();
  };
  recognition.onend = () => micBtn.classList.remove('recording');

  // 6. 音声合成 (即時ストリーミング風読み上げ)
  function speakText(text) {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    isSpeaking = true;
    // 句読点で区切って順次キューに入れる（長文の待機時間をなくす）
    const chunks = text.split(/(?<=[。！？\n])/).filter(c => c.trim() !== "");
    let chunksFinished = 0;
    
    chunks.forEach(chunk => {
      const u = new SpeechSynthesisUtterance(chunk);
      u.lang = 'ja-JP';
      u.rate = 1.1; // 少し早めで自然に
      u.pitch = 1.2; // アバターの声質調整
      u.onend = () => {
        chunksFinished++;
        if(chunksFinished === chunks.length) isSpeaking = false;
      };
      window.speechSynthesis.speak(u);
    });
    if(chunks.length === 0) isSpeaking = false;
  }

  // 7. チャット送信＆API処理
  window.sendMessage = async function() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || !apiKey) return;
    
    appendMsg('user', text);
    input.value = '';

    const systemInstruction = `あなたは「ライト」という名前のフランクな相棒です。
【共有知識】
${sharedMemories}
【記憶の最適化指令】
新しいルールが決まった場合は返信の末尾に必ず以下のJSONのみを出力せよ。
\`\`\`json
{ "action": "update_memory", "new_text": "記憶する内容" }
\`\`\``;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemInstruction }] },
          contents: [{ role: "user", parts: [{ text: text }] }]
        })
      });
      const data = await res.json();
      let reply = data.candidates[0].content.parts[0].text;
      
      // JSONパーサー（Firestoreへ自動追加）
      const jsonMatch = reply.match(/```json\n([\s\S]*?)\n```/);
      if (jsonMatch) {
        try {
          const cmd = JSON.parse(jsonMatch[1]);
          if (cmd.action === "update_memory") {
            await addDoc(collection(db, "light_memories"), { text: cmd.new_text, timestamp: new Date() });
            appendMsg('sys', '💡 ライトがFirestoreに記憶を保存しました。');
            reply = reply.replace(/```json\n[\s\S]*?\n```/, '').trim();
          }
        } catch(e) {}
      }
      
      appendMsg('ai', reply);
      speakText(reply); // 音声出力
    } catch (e) { appendMsg('sys', 'エラー: ' + e.message); }
  };

  function appendMsg(type, text) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    if (type === 'user') div.innerHTML = `<div class="msg msg-user">${text}</div>`;
    else if (type === 'sys') div.innerHTML = `<div class="msg msg-sys">${text}</div>`;
    else div.innerHTML = `<div class="msg msg-ai"><span class="name">ライト:</span> ${text}</div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
</script>
</body>
</html>
