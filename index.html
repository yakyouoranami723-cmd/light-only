<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライト OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #0b0b10; color: #ffffff; font-family: sans-serif; overflow: hidden; }
    
    /* 浮かび上がるUI要素のスタイル */
    .glass-panel { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* アバター呼吸アニメーション */
    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.01); }
    }
    .avatar-breathe { animation: breathe 4s ease-in-out infinite; }
    
    /* 発話中の身振り */
    @keyframes talking {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(1deg); }
      75% { transform: translateY(-1px) rotate(-1deg); }
    }
    .avatar-talking { animation: talking 0.6s ease-in-out infinite; }
    
    /* ログの装飾（スクショ風） */
    .log-system { color: #8bb4c5; font-size: 0.8rem; }
    .log-light { 
      border-left: 3px solid #ff6584; 
      border-radius: 50% 0 0 50%;
      padding-left: 8px;
    }
  </style>
</head>
<body class="h-screen w-screen relative flex items-center justify-center">

  <!-- 1. ログイン画面 -->
  <div id="login-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center space-y-6 bg-[#0b0b10]">
    <div class="text-3xl font-bold flex items-center gap-2"><span class="text-yellow-300">✨</span> ライト OS</div>
    <p class="text-gray-400 text-sm">合言葉（パスワード）を入力</p>
    <input id="passcode-input" type="password" value="shout" class="w-80 bg-[#1e1e26] border border-pink-500/40 rounded-full px-6 py-3 text-center text-white focus:outline-none focus:border-pink-500 transition">
    <button onclick="handleLogin()" class="w-80 bg-gradient-to-r from-pink-500 to-pink-400 text-white font-bold py-3 rounded-full hover:shadow-[0_0_15px_rgba(255,101,132,0.6)] transition">起動</button>
  </div>

  <!-- 2. メイン画面（全画面UI） -->
  <div id="main-screen" class="hidden absolute inset-0 w-full h-full flex flex-col justify-between">
    
    <!-- 背景・アバター表示エリア (一番奥) -->
    <div class="absolute inset-0 flex items-end justify-center pb-20 -z-10">
      <div id="avatar-container" class="avatar-breathe transition-transform duration-300 h-[85vh]">
        <img id="avatar-img" src="https://via.placeholder.com/400x800/000000/ff6584?text=Loading..." alt="Avatar" class="h-full object-contain filter drop-shadow-[0_0_20px_rgba(255,255,255,0.05)]">
      </div>
    </div>

    <!-- 上部ヘッダー -->
    <div class="flex justify-between items-start p-6 z-10 pointer-events-none">
      <div class="font-bold flex items-center gap-2 text-lg text-white drop-shadow-md"><span class="text-yellow-300">✨</span> ライト</div>
      <button onclick="location.reload()" class="pointer-events-auto border border-pink-500/50 bg-black/40 text-pink-300 text-xs px-4 py-1.5 rounded-full hover:bg-pink-500/20 backdrop-blur-md transition flex items-center gap-1">
        ⚙️ 設定
      </button>
    </div>

    <!-- 下部UIエリア (ログ ＋ 入力) -->
    <div class="w-full flex flex-col items-center pb-6 z-10 pointer-events-none">
      
      <!-- 浮かび上がるチャットログ -->
      <div class="w-full max-w-2xl px-4 flex flex-col items-start gap-2 mb-4">
        <div id="chat-logs" class="w-full max-h-48 overflow-y-auto hide-scrollbar flex flex-col gap-2 pointer-events-auto drop-shadow-md">
          <!-- ログがここに追加されます -->
        </div>
      </div>

      <!-- 画像プレビュー (非表示時スペースを取らない) -->
      <div id="image-preview-container" class="hidden relative mb-4 pointer-events-auto">
        <img id="image-preview" src="" class="w-24 h-24 object-cover rounded-xl border-2 border-pink-500 shadow-lg">
        <button onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold">×</button>
      </div>

      <!-- 入力バー -->
      <div class="w-full max-w-2xl px-4 flex gap-3 items-center pointer-events-auto">
        <!-- マイクボタン (ダミー) -->
        <button class="bg-pink-500 hover:bg-pink-400 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg transition">🎤</button>
        
        <!-- テキスト＆画像入力エリア -->
        <div class="flex-1 glass-panel border border-gray-600 rounded-full flex items-center px-4 h-12 shadow-lg">
          <label class="cursor-pointer text-gray-400 hover:text-pink-400 mr-2 transition">
            📷<input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
          </label>
          <input id="user-msg" type="text" placeholder="コメントを追加..." class="bg-transparent w-full text-white text-sm focus:outline-none placeholder-gray-500" onkeydown="if(event.key==='Enter') sendMsg()">
        </div>

        <!-- 送信ボタン -->
        <button onclick="sendMsg()" class="bg-cyan-500 hover:bg-cyan-400 text-white font-bold rounded-full px-6 h-12 shadow-lg transition">送信</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

    let base64Image = null;
    let systemPrompt = "あなたは横浜清陵高校軽音楽部のサポーター「ライト」です。返答の先頭に [normal], [smile], [think] のいずれかを付けてください。";
    
    // アバター画像のURLを保持するオブジェクト
    let AVATAR_IMAGES = { normal: "", smile: "", think: "" };

    async function handleLogin() {
      const pass = document.getElementById("passcode-input").value;
      if (pass === "shout") {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("main-screen").classList.remove("hidden");
        
        // 1. システムルールの読み込み
        db.collection("settings").doc("sharedKnowledge").get().then(snap => {
          if (snap.exists && snap.data().items) {
            systemPrompt += "\n\n【部活全体共有知識】\n・" + snap.data().items.join("\n・");
          }
        });

        // 2. ⚡️ アバター設定のリアルタイム監視（アドミンが変えたら即反映）
        db.collection("settings").doc("avatarConfig").onSnapshot(doc => {
          if (doc.exists) {
            AVATAR_IMAGES = doc.data();
            updateAvatar('normal'); // データが来たらまずはnormalを表示
            appendLog('system', 'クラウドからアバターデータを読み込み完了...');
          }
        });
        
        appendLog('system', 'システム起動。データ同期中...');
      }
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        base64Image = evt.target.result.split(',')[1];
        document.getElementById("image-preview").src = evt.target.result;
        document.getElementById("image-preview-container").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      base64Image = null;
      document.getElementById("image-input").value = "";
      document.getElementById("image-preview-container").classList.add("hidden");
    }

    function updateAvatar(emotion, isSpeaking = false) {
      const imgEl = document.getElementById("avatar-img");
      const container = document.getElementById("avatar-container");
      
      if (AVATAR_IMAGES[emotion]) imgEl.src = AVATAR_IMAGES[emotion];
      
      if (isSpeaking) container.classList.add("avatar-talking");
      else container.classList.remove("avatar-talking");
    }

    function speakText(text, emotion) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP'; uttr.pitch = 1.2; uttr.rate = 1.0;
      uttr.onstart = () => updateAvatar(emotion, true);
      uttr.onend = () => updateAvatar('normal', false);
      window.speechSynthesis.speak(uttr);
    }

    async function sendMsg() {
      const input = document.getElementById("user-msg");
      const text = input.value.trim();
      if (!text && !base64Image) return;

      appendLog("user", text, base64Image ? document.getElementById("image-preview").src : null);
      input.value = "";
      const tempImg = base64Image;
      removeImage();
      updateAvatar('think', false);

      try {
        const contents = [{ role: "user", parts: [...(tempImg ? [{ inline_data: { mime_type: "image/jpeg", data: tempImg } }] : []), { text: text }] }];
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ system_instruction: { parts: [{ text: systemPrompt }] }, contents: contents })
        });
        const data = await res.json();
        let reply = data.candidates[0].content.parts[0].text;
        
        let emotion = 'normal';
        const match = reply.match(/^\[(normal|smile|think)\]/);
        if (match) { emotion = match[1]; reply = reply.replace(/^\[(normal|smile|think)\]\s*/, ''); }
        
        appendLog("light", reply);
        speakText(reply, emotion);
        
        db.collection("chatLogs").add({ userText: text, lightReply: reply, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      } catch (e) {
        appendLog("system", "通信エラーが発生しました。");
        updateAvatar('normal', false);
      }
    }

    function appendLog(role, text, imgSrc = null) {
      const container = document.getElementById("chat-logs");
      const div = document.createElement("div");
      
      let html = '';
      if (role === 'system') {
        html = `<div class="log-system">システム: ${text}</div>`;
      } else if (role === 'user') {
        html = `<div class="text-white text-sm font-bold bg-black/30 px-3 py-1 rounded-lg backdrop-blur-sm">あなた: ${text}</div>`;
      } else {
        html = `<div class="log-light text-white text-sm font-bold bg-black/20 pr-3 py-1 rounded-r-lg backdrop-blur-sm"><span class="text-pink-400 text-xs">✨ ライト: </span>${text}</div>`;
      }
      
      if (imgSrc) {
        html += `<img src="${imgSrc}" class="w-24 h-24 object-cover rounded mt-1 border border-pink-500/30">`;
      }
      
      div.innerHTML = html;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
