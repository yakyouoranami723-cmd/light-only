<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライト OS v8.7 Cloud</title>
    <!-- Three.js & @pixiv/three-vrm (ES Modules) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; margin: 0; overflow: hidden; transition: all 0.5s; }
        
        #avatar-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; transition: all 0.5s; }

        #main-app { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; z-index: 10; transition: all 0.5s; }
        #header-bar { width: 90%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; z-index: 20; }
        .app-title { font-weight: bold; font-size: 16px; color: #ff7eb3; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,126,179,0.5); }
        
        .icon-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid #ff7eb3; color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s; backdrop-filter: blur(5px); }
        .icon-btn:hover { background: rgba(255, 126, 179, 0.3); }
        
        #chat-log { width: 90%; max-width: 650px; height: 350px; background: rgba(20, 20, 30, 0.65); padding: 15px; border-radius: 16px; overflow-y: auto; margin-bottom: 15px; border: 1px solid rgba(255, 126, 179, 0.4); box-shadow: 0 0 25px rgba(255, 126, 179, 0.15); font-size: 15px; line-height: 1.6; box-sizing: border-box; backdrop-filter: blur(8px); scroll-behavior: smooth; transition: opacity 0.5s; }
        
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
        #chat-log::-webkit-scrollbar-thumb { background: rgba(255, 126, 179, 0.5); border-radius: 3px; }

        .msg-sys { color: #88c0d0; font-size: 13px; } .msg-user { color: #a3be8c; margin-top: 6px; } .msg-ai { color: #b48ead; margin-top: 6px; } .msg-error { color: #bf616a; font-weight: bold; background: rgba(191, 97, 106, 0.1); padding: 5px; border-radius: 5px; margin-top: 6px; }
        
        .controls { display: flex; gap: 10px; align-items: center; width: 90%; max-width: 650px; transition: all 0.5s; z-index: 20; }
        button, input[type="text"] { padding: 12px 18px; font-size: 14px; border-radius: 30px; border: none; outline: none; transition: all 0.2s ease; }
        button { cursor: pointer; font-weight: bold; } button:hover { transform: translateY(-2px); } button:active { transform: translateY(1px); } button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #talk-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); flex-shrink: 0; transition: all 0.3s; }
        #chat-input { flex-grow: 1; border: 1px solid #ff7eb3; background: rgba(0,0,0,0.6); color: white; backdrop-filter: blur(5px); transition: opacity 0.5s; }
        #send-btn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4); flex-shrink: 0; min-width: 70px; transition: opacity 0.5s; }
        
        /* === アバターモード用のCSS === */
        body.avatar-mode #chat-log,
        body.avatar-mode #chat-input,
        body.avatar-mode #send-btn { opacity: 0; pointer-events: none; }
        body.avatar-mode .controls { justify-content: center; transform: translateY(100px); }
        body.avatar-mode #talk-btn { transform: scale(1.5); }
        body.avatar-mode #avatar-container { filter: brightness(1.2); } /* アバターを少し明るく */

        /* === 以下既存のモーダル・ログインCSS === */
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161823; border: 1px solid #ff7eb3; border-radius: 16px; width: 85%; max-width: 420px; padding: 20px; box-shadow: 0 0 30px rgba(255, 126, 179, 0.3); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { font-size: 16px; font-weight: bold; color: #ff7eb3; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 0; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; }
        .modal-btn { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid #4facfe; color: #4facfe; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; }
        .section-title { font-size: 12px; color: #88c0d0; margin-top: 20px; margin-bottom: 5px; border-bottom: 1px dashed #88c0d0; padding-bottom: 3px; }
        .sync-box { background: rgba(241, 196, 15, 0.1); border: 1px solid #f1c40f; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        #sync-id-input { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); color: #f1c40f; border: 1px solid #f1c40f; text-align: center; font-weight: bold; letter-spacing: 2px; border-radius: 5px; padding: 8px; margin-bottom: 8px; }
        .sync-btn { background: #f1c40f; color: #000; width: 100%; border-radius: 5px; padding: 8px; border: none; font-weight: bold; cursor: pointer; }
        
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0c10; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .login-title { color: #ff7eb3; font-size: 24px; font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
        .login-desc { color: #ccc; font-size: 14px; margin-bottom: 30px; }
        #login-id-input { width: 80%; max-width: 300px; background: rgba(255,255,255,0.1); color: #fff; border: 2px solid #ff7eb3; text-align: center; font-weight: bold; letter-spacing: 2px; padding: 15px; border-radius: 30px; margin-bottom: 20px; font-size: 16px; }
        #execute-login-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; width: 80%; max-width: 300px; padding: 15px; border-radius: 30px; font-size: 16px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4); }
        #forgot-login-btn { background: transparent; border: 1px solid #88c0d0; color: #88c0d0; padding: 10px 20px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="avatar-container"></div>

    <div id="login-screen">
        <div class="login-title">✨ ライト OS</div>
        <div class="login-desc">合言葉（パスワード）を入力 </div>
        <input type="text" id="login-id-input" placeholder="合言葉を入力">
        <button id="execute-login-btn">起動</button>
        <div style="margin-bottom: 10px; color: #666; font-size: 12px;">または</div>
        <button id="forgot-login-btn">自分専用の合言葉を作る（新規）</button>
    </div>

    <div id="main-app">
        <div id="header-bar">
            <div class="app-title">✨ ライト</div>
            <div>
                <!-- ★モード切替ボタンを追加 -->
                <button id="toggle-mode-btn" class="icon-btn" style="margin-right: 5px;">🔄 アバター</button>
                <button id="open-settings-btn" class="icon-btn">⚙️ 設定</button>
            </div>
        </div>

        <div id="chat-log">
            <div class="msg-sys"><strong>システム:</strong> クラウド連携待機中...</div>
        </div>

        <div class="controls">
            <button id="talk-btn">🔴</button>
            <input type="text" id="chat-input" placeholder="ライトに話しかける...">
            <button id="send-btn">送信</button>
        </div>
    </div>

    <div id="settings-modal">
        <!-- 中身は既存と同じなので省略せずに記載 -->
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ システム設定</div>
                <button class="close-btn" id="close-settings-btn">✖</button>
            </div>
            <div class="setting-row">
                <span>ボイス再生（音声）</span>
                <button id="mute-toggle-btn" class="icon-btn" style="border-color: #bf616a;">🔇 音声 OFF</button>
            </div>
            <div class="section-title">☁️ クラウド記憶同期 (合言葉)</div>
            <div class="sync-box">
                <input type="text" id="sync-id-input" placeholder="合言葉を入力">
                <button id="sync-execute-btn" class="sync-btn">手動で同期する</button>
            </div>
            <div class="section-title">【現在の学習ステータス】</div>
            <div class="setting-row" style="flex-direction: column; align-items: flex-start; margin-bottom: 5px;">
                <span id="brain-status-text" style="font-size: 13px;">自己改善: 0 | 個人記憶: 0 | 部活共有: 0</span>
            </div>
            <button id="view-brain-btn" class="modal-btn">🧠 記憶データの中身を確認 / リセット</button>
            <div class="section-title">【拡張知識】</div>
            <button id="pdf-btn" class="modal-btn">📄 説明書(PDF)を一時記憶させる</button>
            <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // ★ collection, addDoc, serverTimestamp を追加
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const firebaseConfig = {
            apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
            authDomain: "light-65413.firebaseapp.com",
            projectId: "light-65413",
            storageBucket: "light-65413.firebasestorage.app",
            messagingSenderId: "116819261632",
            appId: "1:116819261632:web:9d9144aa125a55371d5525"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const API_KEY = "AQ.Ab8RN6LFpA-TEL3AGVk6l5KQe7Pgi9w455ROTO2txXm5m6SeTg"; 

        window.isMuted = true;
        window.selfReflections = []; window.userFacts = []; window.globalFacts = [];
        window.pdfKnowledge = ""; window.conversationHistory = []; 
        let myUserId = "";
        const GLOBAL_CLUB_ID = "shout_club_global_space";

        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const talkBtn = document.getElementById('talk-btn');
        const settingsModal = document.getElementById('settings-modal');
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');

        // ★ モード切替の処理
        const toggleModeBtn = document.getElementById('toggle-mode-btn');
        let isAvatarMode = false;
        toggleModeBtn.addEventListener('click', () => {
            isAvatarMode = !isAvatarMode;
            document.body.classList.toggle('avatar-mode', isAvatarMode);
            toggleModeBtn.textContent = isAvatarMode ? "💬 チャット" : "🔄 アバター";
        });

        const savedId = localStorage.getItem('light_sync_id');
        if (savedId) { document.getElementById('login-id-input').value = savedId; } 
        else { document.getElementById('login-id-input').value = "shout"; }

        function unlockAudio() {
            if ('speechSynthesis' in window) {
                const dummy = new SpeechSynthesisUtterance(''); dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
        }

        document.getElementById('execute-login-btn').addEventListener('click', () => {
            const inputId = document.getElementById('login-id-input').value.trim();
            if (!inputId) { alert("合言葉を入力してね！"); return; }
            myUserId = inputId;
            localStorage.setItem('light_sync_id', myUserId);
            document.getElementById('sync-id-input').value = myUserId;
            unlockAudio();
            loginScreen.style.display = 'none';
            mainApp.style.display = 'flex';
            loadAllData(myUserId);
        });

        // クラウドへチャットログを保存する関数 ★追加
        async function saveChatLogToCloud(role, text) {
            try {
                await addDoc(collection(db, "light_chat_logs"), {
                    userId: myUserId,
                    role: role, // 'user' または 'ai'
                    text: text,
                    timestamp: serverTimestamp()
                });
            } catch (e) { console.error("ログ保存エラー:", e); }
        }

        function addLog(name, text, type = 'user') {
            const div = document.createElement('div');
            if(type === 'sys') div.className = 'msg-sys';
            else if(type === 'ai') div.className = 'msg-ai';
            else if(type === 'error') div.className = 'msg-error';
            else div.className = 'msg-user';
            div.innerHTML = `<strong>${name}:</strong> ${text}`;
            chatLog.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth', block: 'end' });

            // ユーザーとAIの発言のみクラウドに記録（システムメッセージは記録しない）
            if (type === 'user' || type === 'ai') {
                saveChatLogToCloud(type, text);
            }
        }

        /* データロード・クラウド同期処理（既存コードをそのまま利用） */
        async function loadAllData(userId) {
            try {
                const userDocSnap = await getDoc(doc(db, "light_memories", userId));
                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    window.selfReflections = data.reflections || []; window.userFacts = data.facts || [];
                }
                const globalDocSnap = await getDoc(doc(db, "light_memories", GLOBAL_CLUB_ID));
                if (globalDocSnap.exists()) { window.globalFacts = globalDocSnap.data().globalFacts || []; }
                
                chatLog.innerHTML = ""; // 起動時にシステムログをクリア
                const msg = "よっ！";
                addLog("ライト", msg, "ai");
                window.speak(msg);
                document.getElementById('brain-status-text').textContent = `自己改善: ${window.selfReflections.length} | 個人記憶: ${window.userFacts.length} | 部活共有: ${window.globalFacts.length}`;
            } catch (e) { addLog("エラー", "通信失敗", "error"); }
        }

        async function saveUserToCloud() { await setDoc(doc(db, "light_memories", myUserId), { reflections: window.selfReflections, facts: window.userFacts, updatedAt: new Date() }); }
        async function saveGlobalToCloud() { await setDoc(doc(db, "light_memories", GLOBAL_CLUB_ID), { globalFacts: window.globalFacts, updatedAt: new Date() }); }

        /* （設定モーダル系の処理は省略せず既存通り） */
        document.getElementById('open-settings-btn').addEventListener('click', () => settingsModal.style.display = 'flex');
        document.getElementById('close-settings-btn').addEventListener('click', () => settingsModal.style.display = 'none');
        document.getElementById('mute-toggle-btn').addEventListener('click', (e) => {
            window.isMuted = !window.isMuted;
            if(window.isMuted) { e.target.textContent = "🔇 音声 OFF"; e.target.style.borderColor = "#bf616a"; } 
            else { e.target.textContent = "🔊 音声 ON"; e.target.style.borderColor = "#ff7eb3"; }
        });

        window.currentAudio = null; 
        window.speak = function(text) {
            if (window.isMuted) return;
            if (window.currentAudio) { window.currentAudio.pause(); window.currentAudio = null; }
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[#*「」『』（）()【】_~〜]/g, '').trim();
            if (!cleanText) return;

            const url = `https://api.tts.quest/v3/voicevox/synthesis?text=${encodeURIComponent(cleanText)}&speaker=8`;
            const audio = new Audio(url);
            window.currentAudio = audio;
            
            const fallback = () => {
                window.speechSynthesis.cancel();
                const uttr = new SpeechSynthesisUtterance(cleanText);
                uttr.lang = 'ja-JP'; uttr.rate = 1.1; uttr.pitch = 1.3; 
                window.speechSynthesis.speak(uttr);
            }
            audio.play().catch(fallback); audio.onerror = fallback;
        };

        async function callGemini(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${API_KEY}`;
            const rulesContext = window.selfReflections.length > 0 ? "\n【過去の反省】\n・" + window.selfReflections.join("\n・") : "";
            const factsContext = window.userFacts.length > 0 ? "\n【個人記憶】\n・" + window.userFacts.join("\n・") : "";
            const globalContext = window.globalFacts.length > 0 ? "\n【部活共有ルール】\n・" + window.globalFacts.join("\n・") : "";
            
            const systemInstruction = `あなたはユーザーの相棒「電キャ」の「ライト」です。
            性別：女子 一人称：「あたし」 口調：「〜っしょ！」「〜だぜ！」
            ${rulesContext} ${factsContext} ${globalContext} ${window.pdfKnowledge}
            【ルール】誤字脱字に注意。絵文字は使わない。
            【メタタグ】個人の情報は [FACT: 内容]、部活全体に関わることは [GLOBAL: 内容] として文章の最後に出力。`;

            window.conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            const payload = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: window.conversationHistory,
                generationConfig: { temperature: 0.7 }
            };

            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            let aiReply = data.candidates[0].content.parts[0].text;
            
            let userChanged = false, globalChanged = false;

            [...aiReply.matchAll(/\[REFLECT:\s*(.*?)\]/g)].forEach(m => { if (!window.selfReflections.includes(m[1])) { window.selfReflections.push(m[1]); userChanged = true; }});
            [...aiReply.matchAll(/\[FACT:\s*(.*?)\]/g)].forEach(m => { if (!window.userFacts.includes(m[1])) { window.userFacts.push(m[1]); userChanged = true; }});
            [...aiReply.matchAll(/\[GLOBAL:\s*(.*?)\]/g)].forEach(m => { if (!window.globalFacts.includes(m[1])) { window.globalFacts.push(m[1]); globalChanged = true; }});

            aiReply = aiReply.replace(/【?\s*\[(REFLECT|FACT|GLOBAL):\s*.*?\]\s*】?/g, '').trim();

            if (userChanged) saveUserToCloud();
            if (globalChanged) saveGlobalToCloud(); 

            window.conversationHistory.push({ role: "model", parts: [{ text: aiReply }] });
            if (window.conversationHistory.length > 20) window.conversationHistory.splice(0, 2); 
            
            return aiReply;
        }

        async function processUserInput(text) {
            if (!text || !text.trim()) return;
            addLog("あなた", text, 'user');
            sendBtn.disabled = true; chatInput.disabled = true; talkBtn.disabled = true;
            try {
                const reply = await callGemini(text);
                addLog("ライト", reply, 'ai');
                window.speak(reply);
            } catch (error) {
                addLog("システムエラー", error.message, 'error');
            } finally {
                sendBtn.disabled = false; chatInput.disabled = false; talkBtn.disabled = false;
                chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', () => { const text = chatInput.value; chatInput.value = ''; processUserInput(text); });
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            talkBtn.addEventListener('click', () => { try { recognition.start(); talkBtn.innerHTML = "👂"; } catch(e){} });
            recognition.onresult = (e) => { talkBtn.innerHTML = "🔴"; processUserInput(e.results[0][0].transcript); };
            recognition.onend = () => { talkBtn.innerHTML = "🔴"; };
        } else { talkBtn.style.display = 'none'; }

        /* === Three.js & VRM 処理 === */
        const container = document.getElementById('avatar-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0, 1.4, 2.5);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, Math.PI);
        light.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, Math.PI * 0.5));

        let currentVrm = undefined;
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));

        loader.load(
            'light.vrm', // アバターのファイル名
            (gltf) => {
                const vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                currentVrm = vrm;
                scene.add(vrm.scene);
                VRMUtils.rotateVRM0(vrm);
            },
            () => {},
            (error) => console.error(error)
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (currentVrm) currentVrm.update(clock.getDelta());
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
