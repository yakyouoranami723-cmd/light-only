<html lang="ja">
<head>
<meta charset="UTF-8">

<title>ライト OS — 会話テスト</title>

<style>
:root{
  --bg:#0b0c10;
  --panel:#14151c;
  --panel2:#191a23;
  --pink:#ff7eb3;
  --pink2:#ff5f9f;
  --text:#f5f5f7;
  --muted:#9b9ca8;
  --cyan:#88c0d0;
  --line:rgba(255,126,179,.30);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#19111a 0,#0b0c10 45%,#07080b 100%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

#app{
  width:min(760px,100%);
  min-height:100vh;
  margin:auto;
  padding:18px 14px 24px;
}

.panel{
  background:rgba(20,21,28,.94);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 0 28px rgba(255,126,179,.08);
}

/* =========================
   LOGIN
========================= */

#login{
  width:min(440px,100%);
  margin:15vh auto 0;
  padding:24px;
}

#login h1{
  margin:0 0 8px;
  font-size:21px;
}

.login-sub{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin-bottom:18px;
}

#login-input{
  width:100%;
  padding:13px 15px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#0f1016;
  color:white;
  outline:none;
}

#login-input:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(255,126,179,.10);
}

#login-btn{
  width:100%;
  margin-top:10px;
  padding:13px 16px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--pink2),var(--pink));
  color:white;
  font-weight:800;
}

.login-note{
  margin-top:10px;
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
}

/* =========================
   MAIN
========================= */

#main{
  display:flex;
  flex-direction:column;
  min-height:calc(100vh - 42px);
}

#header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.brand{
  color:var(--pink);
  font-weight:800;
  letter-spacing:1px;
}

.mode{
  color:var(--muted);
  font-size:11px;
  text-align:right;
}

.mode strong{
  color:var(--pink);
}

/* =========================
   CHAT
========================= */

#chat-log{
  height:min(58vh,500px);
  overflow-y:auto;
  padding:15px;

  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:88%;
  padding:10px 13px;
  border-radius:15px;
  line-height:1.55;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-user{
  align-self:flex-end;
  background:rgba(255,126,179,.16);
  border:1px solid rgba(255,126,179,.28);
}

.message-light{
  align-self:flex-start;
  background:#191a23;
  border:1px solid rgba(255,255,255,.07);
}

.message-oto{
  align-self:flex-start;
  background:#10151a;
  border:1px solid rgba(136,192,208,.30);
}

.message-system{
  align-self:center;
  color:var(--muted);
  font-size:11px;
  background:transparent;
  text-align:center;
}

.message-name{
  display:block;
  font-size:10px;
  margin-bottom:3px;
  color:var(--pink);

}

.message-oto .message-name{

}

/* =========================
   VOICE STATUS
========================= */

#voice-status{
  min-height:20px;
  padding:5px 13px;
  color:var(--muted);
  font-size:11px;
}

/* =========================
   COMPOSER
========================= */

#composer{
  margin-top:6px;
  padding:10px;

  display:flex;
  align-items:center;
  gap:8px;
}

#chat-input{
  flex:1;
  min-width:0;

  padding:13px 15px;

  border:1px solid var(--line);
  border-radius:16px;

  background:#0f1016;
  color:white;

}

#chat-input:focus{
  border-color:var(--pink);
}

.action-btn{
  width:46px;
  height:46px;

  border-radius:50%;

  background:#171821;
  color:white;
}

#send-btn{
  background:linear-gradient(135deg,var(--pink2),var(--pink));

}

#voice-btn.active{

}

/* =========================
   TOOLS
========================= */

#tools{

  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.tool-btn{
  padding:7px 11px;

  border:1px solid rgba(255,255,255,.10);

  color:#bbb;

  font-size:11px;
}

.tool-btn:hover{

  color:white;

/* =========================
   STATUS
========================= */

#memory-box{
  margin-top:10px;
  padding:13px 14px;
}

.status-title{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  margin-bottom:6px;
}

#memory-status{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

#speed-box{
  margin-top:10px;
  padding:13px 14px;
}

.speed-row{
  display:flex;
  justify-content:space-between;
  gap:10px;

  margin-top:7px;

  color:var(--muted);
  font-size:11px;
}

}

@media(max-width:500px){

  #app{
    padding:12px 10px 18px;
  }

  #chat-log{
    height:58vh;
  }

    max-width:94%;
  }

/* ============================================================

/* ============================================================
   PERSONALITY
============================================================ */

const LIGHT_SYSTEM = `
あなたは軽音楽部の相棒「ライト」。

一人称は「あたし」。

明るく、自然で、少しボーイッシュ。

あなたは「Oto（オト）」。

/* ============================================================
   UTILITY
============================================================ */

function safeId(text){

  return btoa(
    unescape(
      encodeURIComponent(text)
    )
  )
  .replace(
    /[^a-zA-Z0-9]/g,
    ""
  )
  .slice(0,80);

}


function addSystemMessage(text){

  const div =
    document.createElement("div");

  div.className =
    "message message-system";

  div.textContent =
    text;

  chatLog.appendChild(div);

  chatLog.scrollTop =
    chatLog.scrollHeight;

}


function addMessage(type,text){

  const div =
    document.createElement("div");

  div.className =
    "message message-" + type;

  const name =
    document.createElement("span");

  name.className =
    "message-name";

  if(type === "user"){
    name.textContent =
      "あなた";
  }
  else if(type === "oto"){
    name.textContent =
      "Oto";
  }
  else{
    name.textContent =
      "ライト";
  }

  div.appendChild(name);

  div.appendChild(
    document.createTextNode(text)
  );

  chatLog.appendChild(div);

  chatLog.scrollTop =
    chatLog.scrollHeight;

}


/* ============================================================
   LOGIN PARSER
============================================================ */

function parseLogin(text){

  const parts =
    text
      .trim()
      .split("#");

  const name =
    parts.shift() || "guest";

  const band =
    parts.join("#") || "default";

  return {
    name,
    band
  };

}


/* ============================================================
   API CONFIG
============================================================ */

async function loadApiConfig(){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "light_config",
          "main"
        )
      );

    if(!snap.exists()){
      return;
    }

    const data =
      snap.data();

    apiConfig = {

      apiKeys:
        Array.isArray(data.apiKeys)
          ? data.apiKeys
          : [],

      activeKeyId:
        data.activeKeyId || "",

      model:
        data.model ||
        "gemini-3.8-flash",

      modelMode:
        data.modelMode ||
        "auto"

    };

  }
  catch(error){

    console.warn(
      "API config:",
      error
    );

  }

}


function getApiKey(){

  const keys =
    Array.isArray(apiConfig.apiKeys)
      ? apiConfig.apiKeys
      : [];

  const usable =
    keys.filter(
      item =>
        item &&
        item.enabled !== false &&
        (item.key || item.apiKey)
    );

  if(!usable.length){
    return "";
  }

  const active =
    usable.find(
      item =>
        (item.id || item.keyId) ===
        apiConfig.activeKeyId
    );

  const selected =
    active || usable[0];

  return (
    selected.key ||
    selected.apiKey ||
    ""
  );

}


/* ============================================================
   SESSION / MEMORY
============================================================ */

async function loadSession(){

  const parsed =
    parseLogin(
      loginInput.value
    );

  sessionUserName =
    parsed.name;

  sessionBandName =
    parsed.band;

  sessionBandId =
    safeId(
      sessionBandName
    );

  sessionUserKey =
    safeId(
      sessionUserName +
      "#" +
      sessionBandName
    );


  /*
    ユーザー登録
  */

  const userRef =
    doc(
      db,
      "light_users",
      sessionUserKey
    );

  const userSnap =
    await getDoc(userRef);

  if(!userSnap.exists()){

    await setDoc(
      userRef,
      {
        userName:
          sessionUserName,

        bandName:
          sessionBandName,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );

  }
  else{

    await setDoc(
      userRef,
      {
        updatedAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );

  }


  /*
    記憶
  */

  memories = [];

  try{

    const q =
      query(
        collection(
          db,
          "light_memories"
        ),
        where(
          "userKey",
          "==",
          sessionUserKey
        ),
        limit(100)
      );

    const snap =
      await getDocs(q);

    snap.forEach(
      item => {

        memories.push({
          id:item.id,
          ...item.data()
        });

      }
    );

  }
  catch(error){

    console.warn(
      "memory load:",
      error
    );

  }


  /*
    Brain
  */

  try{

    const brainSnap =
      await getDoc(
        doc(
          db,
          "light_brains",
          sessionUserKey
        )
      );

    if(brainSnap.exists()){

      brain =
        brainSnap.data();

    }

  }
  catch(error){

    console.warn(
      "brain:",
      error
    );

  }


  updateMemoryStatus();

}


/* ============================================================
   MEMORY STATUS
============================================================ */

function updateMemoryStatus(){

  memoryStatus.textContent =
    "ユーザー: " +
    sessionUserName +
    " / " +

    "バンド: " +
    sessionBandName +
    " / " +

    "読み込み記憶: " +
    memories.length +
    "件 / " +

    "今回の会話: " +
    conversation.length +
    "件";

}


/* ============================================================
   RELEVANT MEMORY
============================================================ */

function buildMemoryContext(){

  const result = [];

  if(
    brain &&
    brain.summary
  ){

    result.push(
      "【長期脳要約】\n" +
      brain.summary
    );

  }


  /*
    最大25件程度。
    毎回全記憶を投げない。
    これが速度維持のため重要。
  */

  const recentMemories =
    memories.slice(-25);

  for(
    const memory of recentMemories
  ){

    const title =
      memory.title ||
      memory.key ||
      "記憶";

    const content =
      memory.content ||
      memory.details ||
      memory.text ||
      "";

    if(!content){
      continue;
    }

    result.push(
      `【${title}】\n${String(content).slice(0,500)}`
    );

  }


  return result.length
    ? result.join("\n\n")
    : "関連する長期記憶はありません。";

}


/* ============================================================
   CONVERSATION CONTEXT
============================================================ */

function buildConversationContext(){

  /*
    最新10ターンだけ。
    古い会話を毎回全部送らない。
  */

  return conversation
    .slice(-10)
    .map(
      item => {

        const speaker =
          item.role === "user"
            ? "ユーザー"
            : currentCharacter === "oto"
              ? "Oto"
              : "ライト";

        return (
          speaker +
          ": " +
          item.text
        );

      }
    )
    .join("\n");

}


/* ============================================================
   DAYBREAK
============================================================ */

function isDaybreak(text){

  const normalized =
    String(text)
      .toLowerCase()
      .replace(
        /\s+/g,
        ""
      );

  return (
    normalized.includes(
      "デイブレイク"
    ) ||
    normalized.includes(
      "daybreak"
    )
  );

}


function toggleCharacter(){

  if(
    currentCharacter === "light"
  ){

    currentCharacter =
      "oto";

    addSystemMessage(
      "デイブレイク：Otoに切り替えました。"
    );

  }
  else{

    currentCharacter =
      "light";

    addSystemMessage(
      "デイブレイク：ライトに戻しました。"
    );

  }

  updateModeLabel();

}


function updateModeLabel(){

  const character =
    currentCharacter === "oto"
      ? "Oto"
      : "ライト";

  const channel =
    conversationMode === "voice"
      ? "音声"
      : "チャット";

  modeLabel.innerHTML =
    channel +
    " · <strong>" +
    character +
    "</strong>";

}


/* ============================================================
   PROMPT
============================================================ */

function buildPrompt(userText){

  const system =
    currentCharacter === "oto"
      ? OTO_SYSTEM
      : LIGHT_SYSTEM;


  return (

    system +

    "\n\n" +

    "【ユーザー情報】\n" +
    "ユーザー名: " +
    sessionUserName +
    "\n" +
    "所属バンド: " +
    sessionBandName +

    "\n\n" +

    "【関連する記憶】\n" +
    buildMemoryContext() +

    "\n\n" +

    "【直近の会話】\n" +
    (
      buildConversationContext() ||
      "なし"
    ) +

    "\n\n" +

    "【今回の発言】\n" +
    userText +

    "\n\n" +

    "自然な日本語で返答してください。" +
    "必要以上に長くしないでください。"

  );

}


/* ============================================================
   GEMINI
============================================================ */

async function callGemini(
  userText
){

  const apiKey =
    getApiKey();

  if(!apiKey){

    throw new Error(
      "APIキーが取得できません。light_config/main のAPI設定を確認してください。"
    );

  }


  const model =
    apiConfig.model ||
    "gemini-3.8-flash";


  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/" +
    encodeURIComponent(model) +
    ":generateContent?key=" +
    encodeURIComponent(apiKey);


  const body = {

    contents:[
      {
        role:"user",

        parts:[
          {
            text:
              buildPrompt(
                userText
              )
          }
        ]
      }
    ],

    generationConfig:{

      temperature:0.75,

      maxOutputTokens:700

    }

  };


  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)
      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "Gemini HTTP " +
      response.status
    );

  }


  const text =
    data
      ?.candidates?.[0]
      ?.content?.parts
      ?.map(
        part =>
          part.text || ""
      )
      .join("")
      .trim();


  if(!text){

    throw new Error(
      "AIから空の返答が返りました。"
    );

  }


  return text;

}


/* ============================================================
   AUTOMATIC MEMORY
============================================================ */

/*
  今回は「記憶速度テスト」が目的なので、
  毎回AIに別の判定リクエストを送らない。

  明らかに本人情報・好み・担当などが含まれる
  簡単な発言だけ候補として保存する。
*/

function findMemoryCandidate(
  userText
){

  const patterns = [

    /(?:私は|俺は|僕は|自分は)\s*([^。！？\n]{1,80})(?:です|だよ|だぜ)[。！？]?/,

    /(?:好き|苦手|担当|使ってる|使っている|所属|持ってる|持っている)[^。！？\n]{0,80}/

  ];


  for(
    const pattern of patterns
  ){

    const match =
      userText.match(pattern);

    if(match){

      return match[0].trim();

    }

  }

  return "";

}


async function saveMemoryCandidate(
  userText
){

  const candidate =
    findMemoryCandidate(
      userText
    );

  if(!candidate){
    return;
  }


  /*
    重複チェック
  */

  const duplicate =
    memories.some(
      memory =>
        String(
          memory.content ||
          memory.details ||
          memory.text ||
          ""
        ).includes(candidate)
    );


  if(duplicate){
    return;
  }


  try{

    const reference =
      await addDoc(
        collection(
          db,
          "light_memories"
        ),
        {

          userKey:
            sessionUserKey,

          userName:
            sessionUserName,

          bandName:
            sessionBandName,

          category:
            "personal",

          title:
            "会話から自動保存",

          content:
            candidate,

          source:
            "conversation_test",

          confidence:
            "candidate",

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );


    memories.push({

      id:
        reference.id,

      title:
        "会話から自動保存",

      content:
        candidate

    });


    updateMemoryStatus();

  }
  catch(error){

    console.warn(
      "memory save:",
      error
    );

  }

}

/* ============================================================
   SPEECH SYNTHESIS
============================================================ */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ja-JP";

  utterance.rate =
    1.05;

  utterance.pitch =
    currentCharacter === "oto"
      ? 0.95
      : 1.05;


  speaking = true;


  utterance.onend =
    () => {

      speaking =
        false;

    };


  utterance.onerror =
    () => {

      speaking =
        false;

    };


  speechSynthesis.speak(
    utterance
  );

}


/* ============================================================
   SPEECH RECOGNITION
============================================================ */

function createRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    voiceStatus.textContent =
      "このブラウザでは音声認識が利用できません。";

    return null;

  }


  const recognizer =
    new SpeechRecognition();


  recognizer.lang =
    "ja-JP";

  recognizer.continuous =
    false;

  recognizer.interimResults =
    true;

  recognizer.maxAlternatives =
    1;


  recognizer.onstart =
    () => {

      listening =
        true;

      voiceButton.classList.add(
        "active"
      );

      voiceStatus.textContent =
        "聞いてる…";

    };


  recognizer.onresult =
    event => {

      let finalText =
        "";

      let interimText =
        "";


      for(
        const result of event.results
      ){

        if(result.isFinal){

          finalText +=
            result[0].transcript;

        }
        else{

          interimText +=
            result[0].transcript;

        }

      }


      chatInput.value =
        finalText ||
        interimText;


      if(finalText){

        sendMessage(
          finalText
        );

      }

    };


  recognizer.onerror =
    event => {

      listening =
        false;

      voiceButton.classList.remove(
        "active"
      );

      voiceStatus.textContent =
        "音声入力エラー: " +
        event.error;

    };


  recognizer.onend =
    () => {

      listening =
        false;

      voiceButton.classList.remove(
        "active"
      );

      if(
        conversationMode ===
        "voice"
      ){

        voiceStatus.textContent =
          "🎙を押すともう一度話せます。";

      }
      else{

        voiceStatus.textContent =
          "";

      }

    };


  return recognizer;

}


function startVoice(){

  if(!recognition){

    recognition =
      createRecognition();

  }


  if(!recognition){
    return;
  }


  try{

    recognition.start();

  }
  catch(error){

    console.warn(
      "recognition start:",
      error
    );

  }

}


function stopVoice(){

  try{

    recognition?.stop();

  }
  catch(error){}


  listening =
    false;

  voiceButton.classList.remove(
    "active"
  );

}


/* ============================================================
   CHAT <-> VOICE
============================================================ */

function toggleConversationMode(){

  if(
    conversationMode ===
    "chat"
  ){

    conversationMode =
      "voice";

    updateModeLabel();

    voiceStatus.textContent =
      "音声会話モード";

    startVoice();

  }
  else{

    conversationMode =
      "chat";

    updateModeLabel();

    stopVoice();

    voiceStatus.textContent =
      "";

  }

}


/* ============================================================
   SEND
============================================================ */

async function sendMessage(
  rawText
){

  const text =
    String(rawText || "")
      .trim();


  if(!text){
    return;
  }


  chatInput.value =
    "";


  addMessage(
    "user",
    text
  );


  conversation.push({

    role:
      "user",

    text

  });


  updateMemoryStatus();


  /*
    合言葉はAIへ投げる前に処理。
  */

  if(isDaybreak(text)){

    toggleCharacter();

    conversation.push({

      role:
        "model",

      text:
        currentCharacter ===
        "oto"

          ? "Otoに切り替えました。"

          : "ライトに戻りました。"

    });

    return;

  }


  sendButton.disabled =
    true;

  voiceButton.disabled =
    true;


  voiceStatus.textContent =
    "考え中…";


  const started =
    performance.now();


  try{

    /*
      AI応答
    */

    const reply =
      await callGemini(
        text
      );


    const elapsed =
      Math.round(
        performance.now() -
        started
      );


    /*
      速度記録
    */

    responseTimes.push(
      elapsed
    );


    if(
      responseTimes.length >
      20
    ){

      responseTimes.shift();

    }


    lastSpeed.textContent =
      elapsed +
      " ms";


    const average =
      Math.round(

        responseTimes.reduce(
          (sum,value) =>
            sum + value,
          0
        )
        /
        responseTimes.length

      );


    averageSpeed.textContent =
      average +
      " ms";


    /*
      画面に即表示
    */

    addMessage(

      currentCharacter ===
      "oto"

        ? "oto"

        : "light",

      reply

    );


    conversation.push({

      role:
        "model",

      text:
        reply

    });


    updateMemoryStatus();


    /*
      ここから後処理。
      ユーザーには先に返答済み。
    */

    void saveMemoryCandidate(
      text
    );

    void saveBrain();


    /*
      音声モードなら返答を読む
    */

    if(
      conversationMode ===
      "voice"
    ){

      speak(reply);

    }

  }
  catch(error){

    console.error(
      error
    );


    addSystemMessage(
      "エラー: " +
      error.message
    );

  }
  finally{

    sendButton.disabled =
      false;

    voiceButton.disabled =
      false;


    if(
      conversationMode ===
      "voice"
    ){

      voiceStatus.textContent =
        "🎙を押すと次の発言を聞きます。";

    }
    else{

      voiceStatus.textContent =
        "";

    }

  }

}

  }
);
