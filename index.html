<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIアシスタント - ライト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a1a24; color: #ffffff; font-family: 'Helvetica Neue', sans-serif; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl h-[90vh] bg-[#2a2a35] rounded-lg flex flex-col overflow-hidden border border-gray-600 shadow-xl">
        <!-- ヘッダー -->
        <div class="bg-[#0d0d12] p-4 text-[#ff7eb3] font-bold text-center border-b border-gray-600 flex items-center justify-center gap-2">
            <span>✨</span> ライト - AIチャット
        </div>

        <!-- チャット表示エリア -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <!-- 入力エリア -->
        <div class="bg-[#0d0d12] p-4 border-t border-gray-600 flex gap-2">
            <input type="text" id="user-input" placeholder="メッセージを入力..." class="flex-1 bg-[#1a1a24] text-white border border-gray-600 rounded-lg px-4 py-3 outline-none focus:border-[#88c0d0]" onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-[#88c0d0] text-[#0d0d12] px-6 py-3 rounded-lg font-bold hover:brightness-110 transition">送信</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChocv7osIDAf9z4b1cVcab74b15Xzoudo",
            authDomain: "light-65413.firebaseapp.com",
            projectId: "light-65413",
            storageBucket: "light-65413.firebasestorage.app",
            messagingSenderId: "116819261632",
            appId: "1:116819261632:web:9d9144aa125a55371d5525"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // ★ 超重要：APIキーのローテーションリスト（メイン ＋ ご提示いただいた別アカウントのサブキー）
        const API_KEYS = [
            "ここにあなたのメインのAPIキーを入れてください", 
            "AQ.Ab8RN6KJdFyjMQ_miw7XBSgBGd33sNPrcvo-j1t8oLmuNt9Omg"
        ];
        let currentKeyIndex = 0;
        
        let chatHistory = [];
        let systemMemoryContext = "";

        // 起動時にFirebaseから共有記憶を読み込む
        window.onload = async () => {
            try {
                const docSnap = await getDoc(doc(db, "light_memories", "shout_club_global_space"));
                if (docSnap.exists() && docSnap.data().globalFacts) {
                    const memories = docSnap.data().globalFacts;
                    systemMemoryContext = "【共有記憶・設定】以下の内容を前提として回答してください。\n\n";
                    memories.forEach(mem => {
                        const cat = mem.category || "知識";
                        const title = mem.title || "ルール";
                        const content = mem.content || mem;
                        systemMemoryContext += `【${cat}】 ${title}\n${content}\n\n`;
                    });
                }
            } catch (e) {
                console.error("記憶の読み込みに失敗しました:", e);
            }
            appendMessage("ライト", "こんにちは！何でも気軽に聞いてくださいね。");
        };

        window.sendMessage = async function() {
            const inputEl = document.getElementById("user-input");
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = "";
            appendMessage("あなた", text);
            chatHistory.push({ role: "user", parts: [{ text }] });

            // プロンプトの組み立て（システム記憶 ＋ 履歴 ＋ 最新の質問）
            const contents = [];
            if (systemMemoryContext) {
                contents.push({ role: "user", parts: [{ text: systemMemoryContext }] });
                contents.push({ role: "model", parts: [{ text: "承知いたしました。共有記憶を理解しました。" }] });
            }
            chatHistory.forEach(msg => contents.push(msg));

            const loadingId = appendMessage("ライト", "考え中...");

            // ★ 超重要：APIキーの自動切り替え（ローテーション）処理
            let replyText = "エラーが発生しました。時間をおいて再度お試しください。";
            let success = false;

            for (let attempt = 0; attempt < API_KEYS.length; attempt++) {
                const currentApiKey = API_KEYS[currentKeyIndex];
                
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${currentApiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents })
                    });

                    // 429（制限到達）の場合は次のキーへ自動ローテーション
                    if (res.status === 429) {
                        console.warn(`[Key Index ${currentKeyIndex}] 制限に達しました。次のアカウントキーに切り替えます。`);
                        currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
                        continue;
                    }

                    if (!res.ok) {
                        const errData = await res.json();
                        console.error("API Error Response:", errData);
                        currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
                        continue;
                    }

                    const data = await res.json();
                    if (data.candidates && data.candidates[0].content) {
                        replyText = data.candidates[0].content.parts[0].text;
                        success = true;
                        break; // 成功したらループを抜ける
                    }
                } catch (e) {
                    console.error("Fetch Exception:", e);
                    currentKeyIndex = (currentKeyIndex + 1) % API_KEYS.length;
                }
            }

            document.getElementById(loadingId).remove();
            appendMessage("ライト", replyText);
            chatHistory.push({ role: "model", parts: [{ text: replyText }] });
        };

        function appendMessage(sender, text) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            const isUser = sender === "あなた";
            const id = "msg-" + Date.now();
            div.id = id;
            div.className = `max-w-[80%] p-3 rounded-lg text-sm leading-relaxed ${isUser ? 'bg-[#0f3460] text-white ml-auto' : 'bg-[#1f4068] text-gray-100 mr-auto'}`;
            div.innerHTML = `<div class="text-xs text-[#88c0d0] mb-1 font-bold">${sender}</div><div class="whitespace-pre-wrap">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
